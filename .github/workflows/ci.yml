# Read-only validation for the OpenAI-native framework. Live portal calls,
# external connector writes, publication, and plugin submission are excluded.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-validation:
    name: Native skills, privacy, plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/lint_skills.py
      - run: python tools/security_guards.py
      - run: python tools/package_plugin.py
      - name: Package must contain native skills only
        run: |
          test -f dist/chatgpt-job-search/.codex-plugin/plugin.json
          test -f dist/chatgpt-job-search/skills/apply/SKILL.md
          test "$(find dist/chatgpt-job-search/skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 21
          test "$(find dist/chatgpt-job-search/skills -mindepth 3 -maxdepth 3 -path '*/agents/openai.yaml' | wc -l)" -eq 21
          test ! -e dist/chatgpt-job-search/profile
          test ! -e dist/chatgpt-job-search/documents

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -t . -v

  windows-smoke:
    name: Windows PowerShell setup smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Parse and run the documented environment check
        shell: powershell
        run: |
          $result = powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\check_environment.ps1 -Json | ConvertFrom-Json
          if (-not ($result.tools.name -contains 'python')) { throw 'Python probe missing' }
          if (-not ($result.tools.name -contains 'bun')) { throw 'Bun probe missing' }
          if ($result.expected_origin -ne 'https://github.com/M3G4W4TT5/ChatGPT-Job-Search.git') { throw 'Wrong origin configuration' }
          if ($result.expected_upstream -ne 'https://github.com/MadsLorentzen/ai-job-search.git') { throw 'Wrong upstream configuration' }
      - run: python tools/lint_skills.py
      - run: python tools/security_guards.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Probe dependency graph
        id: graph
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph unavailable (HTTP $code); review skipped"
          fi
      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  latex-smoke:
    name: Compile and inspect synthetic PDFs
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Poppler inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Compile CV
        working-directory: cv
        run: lualatex -interaction=nonstopmode -halt-on-error main_example.tex
      - name: Compile cover letter
        working-directory: cover_letters
        run: xelatex -interaction=nonstopmode -halt-on-error cover_example.tex
      - name: Verify page count and ATS text
        run: |
          python3 tools/verify_pdf.py cv/main_example.pdf --pages 2 --min-chars 100 --contains '[your.email@example.com]' --contains 'Professional Experience'
          python3 tools/verify_pdf.py cover_letters/cover_example.pdf --pages 1 --min-chars 100 --contains 'your.email@example.com' --contains 'Dear [Hiring Manager / Team]'
          pdftotext -layout cv/main_example.pdf cv/main_example.txt
          pdftotext -layout cover_letters/cover_example.pdf cover_letters/cover_example.txt
          test -s cv/main_example.txt
          test -s cover_letters/cover_example.txt
      - name: Render every page
        run: |
          mkdir -p rendered/cv rendered/cover
          pdftoppm -png -r 120 cv/main_example.pdf rendered/cv/page >/dev/null
          pdftoppm -png -r 120 cover_letters/cover_example.pdf rendered/cover/page >/dev/null
          test "$(find rendered/cv -name '*.png' | wc -l)" -eq 2
          test "$(find rendered/cover -name '*.png' | wc -l)" -eq 1

  discover-clis:
    name: Discover portal CLIs
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: list
        run: |
          tools=$(find .agents/skills -mindepth 3 -maxdepth 3 -path '*/cli/package.json' \
            | cut -d/ -f3 | sort | jq -R . | jq -cs .)
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  cli-checks:
    name: CLI checks ${{ matrix.tool }}
    needs: discover-clis
    if: needs.discover-clis.outputs.tools != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover-clis.outputs.tools) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun run typecheck
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - name: Run fixture and mock tests
        working-directory: .agents/skills/${{ matrix.tool }}/cli
        run: |
          if find tests -type f -name '*.test.ts' | grep -q .; then
            bun test
          else
            echo "No Bun tests found; skipping"
          fi

  placeholder-integrity:
    name: Synthetic fixture integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Public templates remain synthetic
        run: |
          grep -q '\[YOUR_NAME\]' cv/main_example.tex
          grep -q '\[YOUR NAME\]' cover_letters/cover_example.tex
          grep -q '\[YOUR_NAME\]' .agents/skills/setup/assets/profile-template/candidate-profile.md
          grep -q 'fictional test data' tests/fixtures/synthetic/candidate-profile.md
          test -f profile/.gitkeep
